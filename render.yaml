services:
  - type: web
    name: rentnest-api
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    preDeployCommand: npm run db:push && npm run seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: ADMIN_EMAIL
        value: admin@rentnest.com
      - key: ADMIN_PASSWORD
        sync: false
